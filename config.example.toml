# Copy to ~/.config/virtmanager-mcp/config.toml

# libvirt URI. qemu:///system is what virt-manager uses by default.
uri = "qemu:///system"

# VMs the AI may access (names as shown in virt-manager). "*" allows all.
# An empty list means no VM is accessible.
allowed_vms = ["fedora-test", "win11"]

# VMs the AI may start and stop (must also be in allowed_vms). "*" = every allowed VM.
# Empty (the default) hides start_vm/stop_vm.
power_vms = ["fedora-test"]

# Host directories the AI may copy files from into a guest with copy_to_vm.
# Empty (the default) hides copy_to_vm.
# host_share_dirs = ["/home/me/vm-share"]

# Also share the directory the server is started in. Claude Code starts the server in the
# session's project directory, so this limits copying to the current project. Ignored when
# that directory is / or your home directory.
share_project_dir = false

# Host directories that pulls from a guest may write into. Empty (the default) hides the pull
# tools. The server refuses to start when one overlaps a share directory, the project directory,
# an ISO directory or a libvirt storage pool, because the guest controls what a pull writes.
# host_pull_dirs = ["/home/me/vm-pulls"]

# When true, only list_vms, read_file, list_dir, stat_path and the console_open/
# console_read/console_close tools are exposed.
read_only = false

# VM management. Everything here is off by default; each operation is enabled separately.
# Management tools act on VMs this server created (marked in their libvirt metadata) and on
# VMs listed in manage_vms. VMs this server created are also treated as if they were in
# allowed_vms and power_vms while any operation below is enabled. read_only hides it all.
[manage]
create = false        # create_vm
delete = false        # delete_vm (deletes the VM's disks that are in disk_pool)
reconfigure = false   # configure_vm, attach_disk, detach_disk, set_cdrom, attach_nic, detach_nic
snapshots = false     # snapshot_create, snapshot_list, snapshot_revert, snapshot_delete
# Existing VMs (must also be in allowed_vms) the enabled operations may act on. "*" = every allowed VM.
manage_vms = []
# libvirt storage pool (directory type) where new disks are created. Required for create.
disk_pool = ""
# Host directories ISO images may be used from (create_vm, set_cdrom, list_isos).
iso_dirs = []
# libvirt networks VMs may be connected to. The first one is the create_vm default.
networks = []
max_vms = 2           # VMs created by this server that may exist at once
max_vcpus = 2         # per VM
max_memory_mib = 4096 # per VM
max_disk_gib = 32     # per disk
max_lifetime_minutes = 1440 # longest lifetime an agent may give a VM made from a template

# Templates disposable VMs are made from, one table each (see docs/templates.md). Each VM gets a
# thin overlay on the template volume and a seed disk with its hostname. Needs create = true.
# [manage.templates.debian13]
# volume = "tpl-debian13.qcow2"                    # qcow2 volume in disk_pool; never change it while VMs use it
# os = "linux"                                     # or "windows"
# firmware = "bios"                                # or "uefi"
# description = "Debian 13 with qemu-guest-agent"
# user_data = "/etc/virtmanager-mcp/debian13.yaml" # optional; must start with a #cloud-config line

[limits]
exec_timeout_secs = 60              # default per-call exec timeout
max_output_bytes = 1048576          # stdout/stderr cap per exec call
max_file_read_bytes = 10485760      # read_file cap
agent_timeout_secs = 10             # single guest agent request
console_buffer_bytes = 262144       # serial console scrollback per VM
max_wait_secs = 50                  # longest a wait_for or paced console_write may block
max_pull_bytes = 1073741824         # largest file or archive one pull from a guest may write
max_pull_entries = 100000           # most entries one directory pull may hold
max_transfers = 4                   # copies running in the background at once

# Screen text recognition for wait_for's screen_text condition. Unset (the default) turns it off;
# screen_settled, screenshots and the mouse work without it. Set it to the absolute directory that
# scripts/fetch-ocr-models.sh filled; the directory and both model files must exist.
# [display]
# ocr_models = "/home/me/.local/share/virtmanager-mcp/ocr-models"

[http]
bind = "127.0.0.1:8765"
# Required for --transport http. Can also be set via VIRTMANAGER_MCP_TOKEN.
# token = "change-me"
